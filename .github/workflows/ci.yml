name: CI

on:
  push:
    branches: [ "feat/new_download", "master" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Prefer a real Firebase config from repository secrets. If it is not
      # configured (for example on a fresh fork), use the dummy config so the
      # release build can still run.
      - name: Prepare google-services.json
        env:
          DATA: ${{ secrets.HA1_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$DATA" ]; then
            echo "$DATA" | base64 -d > app/google-services.json
          else
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --console=plain
        env:
          HA1_VERSION_SOURCE: 'ci'
          HA1_GITHUB_TOKEN: ${{ secrets.HA1_GITHUB_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Han1meViewer-revive-${{ github.sha }}
          path: app/build/outputs/apk/release/Han1meViewer-revive-v*.apk
          if-no-files-found: error
