name: CI

on:
  push:
    branches: [ "feat/new_download", "master" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Prefer a real Firebase config from repository secrets. If it is not
      # configured (for example on a fresh fork), use the dummy config so the
      # release build can still run.
      - name: Prepare google-services.json
        env:
          DATA: ${{ secrets.HA1_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$DATA" ]; then
            echo "$DATA" | base64 -d > app/google-services.json
          else
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --console=plain
        env:
          HA1_VERSION_SOURCE: 'ci'
          HA1_GITHUB_TOKEN: ${{ secrets.HA1_GITHUB_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Han1meViewer-revive-${{ github.sha }}
          path: app/build/outputs/apk/release/Han1meViewer-revive-v*.apk
          if-no-files-found: error

      # Only the official repository publishes releases. Forks still get the
      # Actions artifact above, but no release is created in their repository.
      #
      # The repository has immutable releases enabled, so the asset must be
      # uploaded while the release is still a draft and published afterwards.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/feat/new_download' && github.repository == 'SuperHeiHun/Han1meViewer-revive'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          APK=$(ls -t app/build/outputs/apk/release/Han1meViewer-revive-v*.apk 2>/dev/null | head -n1 || true)
          if [ -z "$APK" ]; then
            echo "Release APK not found" >&2
            exit 1
          fi

          APK_NAME=$(basename "$APK")
          VERSION_NAME=${APK_NAME#Han1meViewer-revive-v}
          VERSION_NAME=${VERSION_NAME%.apk}
          VERSION_CODE=${VERSION_NAME##*+}
          TAG="v$(echo "$VERSION_NAME" | sed -E 's/-ci\+/+/')"
          TITLE="Han1meViewer-revive v${VERSION_NAME}"
          SHA256=$(sha256sum "$APK" | awk '{print $1}')

          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Draft release $TAG already exists; uploading and publishing."
              gh release upload "$TAG" "$APK" --clobber
              gh release edit "$TAG" --draft=false --latest
              exit 0
            fi
            echo "Release $TAG already exists; skipping."
            exit 0
          fi

          NOTES=$(mktemp)
          cat > "$NOTES" <<EOF
          Han1meViewer-revive 社区修复版本。

          ## 修复内容
          - 适配目标站点新版页面结构
          - 修复首页、搜索、视频、评论和预览页解析
          - 更新搜索参数与标签数据
          - 修复播放列表删除接口
          - 修复使用示例 Firebase 配置时的启动崩溃
          - 恢复“关于”页面，修复设置中“关于”无法点击
          - 弹窗引导 Cloudflare 人机验证，验证完成后自动同步 Cookie 并重试

          ## 安装说明
          - 使用公开测试签名，若已安装原版 Han1meViewer，可能需要先卸载
          - 该签名仅用于测试，不适用于正式分发
          - 登录后的部分功能尚未完整验证

          ## 构建信息
          - Commit: \`${GITHUB_SHA}\`
          - Version: \`${VERSION_NAME}\`
          - Version code: \`${VERSION_CODE}\`
          - SHA-256: \`${SHA256}\`
          EOF

          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "$NOTES"

          gh release upload "$TAG" "$APK"

          gh release edit "$TAG" --draft=false --latest
