name: CI

on:
  push:
    branches: [ "feat/new_download", "master" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Prefer a real Firebase config from repository secrets. If it is not
      # configured (for example on a fresh fork), use the dummy config so the
      # release build can still run.
      - name: Prepare google-services.json
        env:
          DATA: ${{ secrets.HA1_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$DATA" ]; then
            echo "$DATA" | base64 -d > app/google-services.json
          else
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --console=plain
        env:
          HA1_VERSION_SOURCE: 'ci'
          HA1_GITHUB_TOKEN: ${{ secrets.HA1_GITHUB_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Han1meViewer-revive-${{ github.sha }}
          path: app/build/outputs/apk/release/Han1meViewer-revive-v*.apk
          if-no-files-found: error

      # Only the official repository publishes releases. Forks still get the
      # Actions artifact above, but no release is created in their repository.
      #
      # The repository has immutable releases enabled, so the asset must be
      # uploaded while the release is still a draft and published afterwards.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/feat/new_download' && github.repository == 'SuperHeiHun/Han1meViewer-revive'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          METADATA=app/build/outputs/apk/release/output-metadata.json
          IFS=$'\t' read -r VERSION_NAME VERSION_CODE APK_NAME < <(
            python3 - "$METADATA" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              output = json.load(stream)["elements"][0]
          print(output["versionName"], output["versionCode"], output["outputFile"], sep="\t")
          PY
          )
          APK="app/build/outputs/apk/release/$APK_NAME"
          test -f "$APK"
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v${VERSION_NAME}"
          TITLE="Han1meViewer-revive v${VERSION_NAME}"
          SHA256=$(sha256sum "$APK" | awk '{print $1}')

          NOTES=$(mktemp)
          trap 'rm -f "$NOTES"' EXIT
          CHANGELOG="changelogs/${VERSION_NAME}.md"
          if [ ! -s "$CHANGELOG" ]; then
            echo "Missing or empty changelog: $CHANGELOG" >&2
            exit 1
          fi
          cp "$CHANGELOG" "$NOTES"

          cat >> "$NOTES" <<EOF

          ## 构建信息
          - Commit: \`${GITHUB_SHA}\`
          - Version: \`${VERSION_NAME}\`
          - Version code: \`${VERSION_CODE}\`
          - SHA-256: \`${SHA256}\`
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Draft release $TAG already exists; uploading and publishing."
              gh release upload "$TAG" "$APK" --clobber
              gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" --draft=false --latest
              exit 0
            fi
            echo "Release $TAG already exists; skipping."
            exit 0
          fi

          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "$NOTES"

          gh release upload "$TAG" "$APK"

          gh release edit "$TAG" --draft=false --latest
